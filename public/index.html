
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro al taller de Desarrollo Web</title>

  <!-- Conexión con CSS -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Conexión con JavaScript -->
  <script src="./app.js" defer></script>
</head>

<body>
  <main class="contenedor">

    <header class="encabezado">
      <p class="etiqueta">
        Universidad · Actividad de clase
      </p>
      <h1>Registro al taller</h1>
      <p>Completa tus datos para reservar un espacio.</p>
    </header>

    <section class="panel" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Datos de inscripción</h2>

      <form id="formulario-registro">

        <!-- Nombre completo -->
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          required
          minlength="2"
          maxlength="100"
          autocomplete="name"
        >

        <!-- Correo electrónico -->
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          name="correo"
          type="email"
          required
          autocomplete="email"
        >

        <!-- Taller -->
        <label for="taller">Taller</label>
        <select id="taller" name="taller" required>
          <option value="">Selecciona un taller</option>
          <option value="HTML y CSS">HTML y CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Node.js y Express">
            Node.js y Express
          </option>
        </select>

        <!-- Nuevo campo: teléfono -->
        <label for="telefono">Número de teléfono</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          required
          minlength="8"
          maxlength="15"
          autocomplete="tel"
          placeholder="Ejemplo: 12345678"
        >

        <!-- Nuevo campo: horario -->
        <label for="horario">Horario del taller</label>
        <select id="horario" name="horario" required>
          <option value="">Selecciona un horario</option>
          <option value="Matutino">Matutino</option>
          <option value="Vespertino">Vespertino</option>
        </select>

        <!-- Botón de registro -->
        <button type="submit">
          Registrar inscripción
        </button>

      </form>

      <!-- Mensajes del formulario -->
      <p
        id="mensaje"
        class="mensaje"
        role="status"
        aria-live="polite">
      </p>
    </section>

    <!-- Lista de participantes -->
    <section class="panel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Participantes inscritos</h2>

      <ul id="lista-inscripciones" aria-live="polite">
        <li class="vacio">
          Aún no hay inscripciones.
        </li>
      </ul>
    </section>

  </main>
</body>
</html>
